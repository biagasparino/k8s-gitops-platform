apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
    {{- include "tasks.selector" (dict "component" "backend") | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below the desired capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "tasks.selector" (dict "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasks.labels" . | nindent 8 }}
        {{- include "tasks.selector" (dict "component" "backend") | nindent 8 }}
      annotations:
        # Changing the ConfigMap changes this hash, which triggers a rolling restart
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: tasks-backend
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so one node failure cannot take the whole API down
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "tasks.selector" (dict "component" "backend") | nindent 14 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: tasks-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tasks.dbSecretName" . }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tasks.dbSecretName" . }}
                  key: password
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # startupProbe gives the app time to wait for the database before liveness kicks in
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          # liveness: "is the process alive?" -> restart if not. Never checks the database.
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readiness: "can it serve traffic?" -> removed from the Service if the DB is down.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- include "tasks.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
  {{- with .Values.ingress.backendServiceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "tasks.selector" (dict "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tasks-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tasks-backend
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # avoid flapping after a traffic spike
{{- end }}
{{- if .Values.backend.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tasks-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "tasks.selector" (dict "component" "backend") | nindent 6 }}
{{- end }}

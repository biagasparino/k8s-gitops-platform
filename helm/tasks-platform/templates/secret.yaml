{{- /*
  Dev convenience only. In staging/prod set database.existingSecret and create the Secret
  out-of-band (scripts/create-db-secret.sh) or with External Secrets Operator / Sealed Secrets,
  so no credential ever lives in Git.
*/ -}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tasks.dbSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.database.username | quote }}
  password: {{ required "database.password is required when database.existingSecret is empty (dev only)" .Values.database.password | quote }}
{{- end }}

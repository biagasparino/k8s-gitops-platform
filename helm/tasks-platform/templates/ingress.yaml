{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasks
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          # More specific path first: /api goes to FastAPI, everything else to React
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tasks-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tasks-frontend
                port:
                  name: http
      {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
{{- end }}

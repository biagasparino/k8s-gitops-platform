apiVersion: v1
kind: ConfigMap
metadata:
  name: tasks-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "tasks.dbHost" . | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  LOG_LEVEL: {{ .Values.backend.logLevel | quote }}
  APP_VERSION: {{ .Values.backend.image.tag | quote }}

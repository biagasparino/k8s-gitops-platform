{{- if .Values.rbac.create }}
{{- range $component := list "backend" "frontend" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasks-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tasks.labels" $ | nindent 4 }}
# Pods get no API token unless they ask for one: the app never talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
{{- end }}

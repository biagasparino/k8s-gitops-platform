# "App of apps": the one and only object applied by hand. From then on ArgoCD reads
# gitops/argocd/ and creates the AppProject plus the dev/staging/prod Applications itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/biagasparino/k8s-gitops-platform.git
    targetRevision: main
    path: gitops/argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# PROD — ArgoCD shows drift but a human clicks "Sync" (manual sync policy).
# A change reaches this file only through a reviewed pull request.
environment: prod

backend:
  image:
    tag: "latest"
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 1, memory: 512Mi }
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 65 }
  pdb: { enabled: true, minAvailable: 2 }
  logLevel: WARNING

frontend:
  image:
    tag: "latest"
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 6, targetCPUUtilizationPercentage: 65 }
  pdb: { enabled: true, minAvailable: 2 }

database:
  existingSecret: tasks-db-credentials
  # In a real production setup use a managed database: set postgres.enabled=false and
  # point host at the Amazon RDS endpoint, e.g.
  #   host: tasks-prod.xxxxxxxx.us-east-1.rds.amazonaws.com
# postgres:
#   enabled: false

ingress:
  className: alb
  host: ""                               # e.g. tasks.example.com (+ ACM certificate annotation for HTTPS)
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  backendServiceAnnotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
  frontendServiceAnnotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz

networkPolicy:
  ingressFrom:
    - ipBlock:
        cidr: 192.168.0.0/16

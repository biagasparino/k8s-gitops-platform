# PROD: manual sync on purpose.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasks-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tasks
  source:
    repoURL: https://github.com/biagasparino/k8s-gitops-platform.git
    targetRevision: main
    path: helm/tasks-platform
    helm:
      valueFiles:
        - ../../gitops/environments/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tasks-prod
  # No "automated" block: production deploys only when a human presses Sync.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true

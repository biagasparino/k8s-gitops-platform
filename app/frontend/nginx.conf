server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness/readiness endpoint for the frontend pod
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Single-page app: unknown paths fall back to index.html
  location / {
    try_files $uri /index.html;
  }
}

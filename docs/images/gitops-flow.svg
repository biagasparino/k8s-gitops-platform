<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#0b1220"/>
  <text x="450" y="32" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="700">GitOps delivery flow</text>
  <g font-size="12" fill="#fff" text-anchor="middle">
    <rect x="14"  y="96" width="100" height="64" rx="10" fill="#334155"/><text x="64"  y="124">Developer</text><text x="64"  y="142" font-size="10" fill="#cbd5e1">git push / PR</text>
    <rect x="132" y="96" width="100" height="64" rx="10" fill="#1f2937" stroke="#94a3b8"/><text x="182" y="124">GitHub</text><text x="182" y="142" font-size="10" fill="#cbd5e1">code review</text>
    <rect x="250" y="96" width="100" height="64" rx="10" fill="#1d4ed8"/><text x="300" y="124">CI</text><text x="300" y="142" font-size="10" fill="#dbeafe">test · lint · helm</text>
    <rect x="368" y="96" width="100" height="64" rx="10" fill="#0e7490"/><text x="418" y="124">Docker image</text><text x="418" y="142" font-size="10" fill="#cffafe">tag = commit SHA</text>
    <rect x="486" y="96" width="100" height="64" rx="10" fill="#7e22ce"/><text x="536" y="124">Registry</text><text x="536" y="142" font-size="10" fill="#f3e8ff">ghcr.io</text>
    <rect x="604" y="96" width="100" height="64" rx="10" fill="#b45309"/><text x="654" y="124">GitOps repo</text><text x="654" y="142" font-size="10" fill="#fef3c7">values.yaml tag</text>
    <rect x="722" y="96" width="76"  height="64" rx="10" fill="#ea580c"/><text x="760" y="124">ArgoCD</text><text x="760" y="142" font-size="10" fill="#ffedd5">pull + sync</text>
    <rect x="812" y="96" width="76"  height="64" rx="10" fill="#15803d"/><text x="850" y="124">EKS</text><text x="850" y="142" font-size="10" fill="#dcfce7">running</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#b)">
    <line x1="114" y1="128" x2="132" y2="128"/><line x1="232" y1="128" x2="250" y2="128"/>
    <line x1="350" y1="128" x2="368" y2="128"/><line x1="468" y1="128" x2="486" y2="128"/>
    <line x1="586" y1="128" x2="604" y2="128"/><line x1="704" y1="128" x2="722" y2="128"/>
    <line x1="798" y1="128" x2="812" y2="128"/>
  </g>
  <path d="M760 160 C 760 215, 654 215, 654 166" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="707" y="232" text-anchor="middle" fill="#fdba74" font-size="11">ArgoCD pulls from Git — the cluster is never pushed to</text>
  <text x="450" y="272" text-anchor="middle" fill="#94a3b8" font-size="11">dev: auto-sync · staging: auto-sync after a promotion PR · prod: promotion PR + manual Sync</text>
</svg>

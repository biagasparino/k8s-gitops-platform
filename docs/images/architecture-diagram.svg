<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#0f172a"/>
  <text x="450" y="36" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Kubernetes Architecture (Amazon EKS)</text>

  <ellipse cx="450" cy="84" rx="64" ry="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="450" y="89" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="600">Internet</text>
  <line x1="450" y1="108" x2="450" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="340" y="140" width="220" height="44" rx="8" fill="#f97316"/>
  <text x="450" y="167" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">ALB (AWS Load Balancer Controller)</text>

  <rect x="40" y="206" width="820" height="410" rx="14" fill="#111c34" stroke="#326ce5" stroke-width="2"/>
  <text x="60" y="232" fill="#93c5fd" font-size="14" font-weight="700">EKS cluster · namespace tasks-{dev|staging|prod}  (Pod Security: restricted)</text>

  <rect x="340" y="246" width="220" height="40" rx="8" fill="#1d4ed8"/>
  <text x="450" y="271" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Ingress  /  → web   /api → api</text>
  <line x1="400" y1="286" x2="230" y2="326" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="286" x2="670" y2="326" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="328" width="300" height="104" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="230" y="352" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="700">Service + Deployment: frontend (React/nginx)</text>
  <rect x="104" y="368" width="116" height="46" rx="6" fill="#15803d"/><text x="162" y="396" text-anchor="middle" fill="#fff" font-size="12">Pod</text>
  <rect x="240" y="368" width="116" height="46" rx="6" fill="#15803d"/><text x="298" y="396" text-anchor="middle" fill="#fff" font-size="12">Pod</text>

  <rect x="520" y="328" width="300" height="104" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="670" y="352" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="700">Service + Deployment: api (FastAPI)</text>
  <rect x="544" y="368" width="116" height="46" rx="6" fill="#15803d"/><text x="602" y="396" text-anchor="middle" fill="#fff" font-size="12">Pod</text>
  <rect x="680" y="368" width="116" height="46" rx="6" fill="#15803d"/><text x="738" y="396" text-anchor="middle" fill="#fff" font-size="12">Pod</text>
  <text x="670" y="450" text-anchor="middle" fill="#86efac" font-size="11">HPA 2→6 pods · PDB minAvailable · probes</text>

  <line x1="670" y1="432" x2="520" y2="488" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="380" y="490" width="260" height="84" rx="10" fill="#7c2d12" stroke="#fb923c" stroke-width="1.5"/>
  <text x="510" y="516" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">StatefulSet: PostgreSQL</text>
  <text x="510" y="536" text-anchor="middle" fill="#fed7aa" font-size="11">PVC on EBS gp3 · only the API may connect</text>
  <text x="510" y="556" text-anchor="middle" fill="#fed7aa" font-size="11">(NetworkPolicy)</text>

  <rect x="60" y="490" width="270" height="104" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="195" y="514" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="700">Configuration</text>
  <text x="195" y="536" text-anchor="middle" fill="#c7d2fe" font-size="11">ConfigMap · Secret · ServiceAccount</text>
  <text x="195" y="556" text-anchor="middle" fill="#c7d2fe" font-size="11">RBAC Role + RoleBinding (read-only)</text>
  <text x="195" y="576" text-anchor="middle" fill="#c7d2fe" font-size="11">Resource requests / limits</text>

  <rect x="680" y="490" width="160" height="84" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="760" y="520" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700">ArgoCD</text>
  <text x="760" y="540" text-anchor="middle" fill="#94a3b8" font-size="11">keeps all of this</text>
  <text x="760" y="556" text-anchor="middle" fill="#94a3b8" font-size="11">equal to Git</text>
</svg>

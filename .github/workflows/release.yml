# Developer -> GitHub -> CI -> Docker image -> Container registry -> GitOps repo -> ArgoCD
#
# On every merge to main that changes application code this workflow:
#   1. builds both images and pushes them to GitHub Container Registry, tagged with the commit SHA
#   2. writes that tag into gitops/environments/dev/values.yaml and commits it
# ArgoCD notices the new commit and rolls the change out to the dev namespace on EKS.
name: Release (build + push + update GitOps)

on:
  push:
    branches: [main]
    paths:
      - "app/**"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write     # commit the new image tag
  packages: write     # push to ghcr.io

env:
  REGISTRY: ghcr.io
  OWNER: biagasparino

jobs:
  test:
    name: Run tests before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r app/backend/requirements-dev.txt && cd app/backend && ruff check . && pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd app/frontend && npm ci && npm test

  build-and-push:
    name: Build + push images
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/tasks-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/tasks-frontend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  update-gitops:
    name: Update dev image tag in Git
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the new tag into the dev values file
        run: |
          TAG="${{ needs.build-and-push.outputs.tag }}"
          sed -i -E "s/^(\s*tag:\s*).*/\1\"${TAG}\"/" gitops/environments/dev/values.yaml
          git diff --stat
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/environments/dev/values.yaml
          git commit -m "chore(dev): deploy ${{ needs.build-and-push.outputs.tag }} [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main

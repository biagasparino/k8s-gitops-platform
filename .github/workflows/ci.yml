name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "gitops/environments/**"   # image-tag bumps made by the pipeline itself must not retrigger CI
      - "**.md"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  helm:
    name: Helm (lint + render + schema validation)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: helm lint
        run: helm lint helm/tasks-platform -f gitops/environments/${{ matrix.env }}/values.yaml
      - name: helm template | kubeconform
        run: |
          helm template tasks helm/tasks-platform \
            --namespace tasks-${{ matrix.env }} \
            -f gitops/environments/${{ matrix.env }}/values.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.31.0
      - name: Same chart renders with the local kind values
        if: matrix.env == 'dev'
        run: |
          helm template tasks helm/tasks-platform --namespace tasks-local -f kind/values-kind.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.31.0

  docker:
    name: Docker images build (no push)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend, context: app/backend }
          - { name: frontend, context: app/frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
